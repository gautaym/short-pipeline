beats:
  - en: "More than two thousand years ago, Maharishi Valmiki watched a hunter shoot one of two cranes in love. His grief poured out as a verse, and tradition calls it the first poem in Sanskrit."
    hi: "दो हज़ार साल से भी पहले, महर्षि वाल्मीकि ने देखा कि एक शिकारी ने प्रेम में डूबे क्रौंच पक्षियों के जोड़े में से एक को मार दिया। उनका दुख एक श्लोक बनकर फूट पड़ा, और परंपरा उसे संस्कृत की पहली कविता मानती है।"
    caption: "THE *FIRST* POEM."
    scene: river
    stage:
      backdrop: river
      fx: [rays]
      actors:
        cranes: {puppet: cranes, x: 760, y: 1500, h: 520, motion: bob, enter: fade}
        valmiki: {puppet: valmiki, x: 330, y: 1680, h: 820, face: right, motion: breathe, enter: left}
  - en: "In that new verse, he told the story of Lord Rama, in about twenty four thousand verses and seven books. He called it the Ramayana, which means Rama's journey."
    hi: "इसी नए छंद में उन्होंने प्रभु श्रीराम की कथा लिखी, लगभग चौबीस हज़ार श्लोकों और सात कांडों में। नाम रखा रामायण, यानी राम की यात्रा।"
    caption: "RAMA'S *JOURNEY*."
    scene: river
    stage:
      backdrop: river
      fx: [{glow: {actor: scroll, colour: [255, 225, 150]}}]
      actors:
        valmiki: {puppet: valmiki, x: 330, y: 1680, h: 820, face: right, motion: breathe}
        scroll: {puppet: scroll, x: 760, y: 1300, h: 480, motion: float, enter: fade}
  - en: "It is the story of a prince of Ayodhya who gave up his throne to keep his father's word, and spent fourteen years in the forest with Maa Sita and Lakshmana."
    hi: "यह अयोध्या के उस राजकुमार की कथा है, जिसने पिता का वचन निभाने के लिए राजगद्दी छोड़ दी, और माँ सीता और लक्ष्मण जी के साथ चौदह साल वन में बिताए।"
    caption: "FOURTEEN YEARS IN THE *FOREST*."
    scene: panchavati
    stage:
      backdrop: panchavati
      actors:
        lakshmana: {puppet: lakshmana_pray, x: 220, y: 1690, h: 960, face: right, motion: walk_in, enter: left}
        sita: {puppet: sita, x: 470, y: 1670, h: 900, face: right, motion: walk_in, enter: left}
        rama: {puppet: rama, x: 760, y: 1690, h: 1000, face: right, motion: walk_in, enter: left}
  - en: "When Ravana carried Maa Sita away to Lanka, Lord Rama crossed the sea with Hanuman ji and an army of vanaras, won the war, and brought her home."
    hi: "जब रावण माँ सीता को उठाकर लंका ले गया, तो प्रभु श्रीराम हनुमान जी और वानर सेना के साथ समुद्र पार गए, युद्ध जीता, और उन्हें घर ले आए।"
    caption: "ACROSS THE *SEA*."
    scene: sea
    stage:
      backdrop: sea
      fx: [rays]
      actors:
        hanuman: {puppet: hanuman, x: 300, y: 1560, h: 950, face: right, motion: float, enter: left}
        ravana: {puppet: ravana, x: 800, y: 1700, h: 1000, motion: tremble, enter: fade}
  - en: "[excited] But for Hindus, the Ramayana is far more than a story. Lord Rama is worshipped as an avatar of Lord Vishnu, who came to earth to restore dharma."
    hi: "[excited] पर हिंदुओं के लिए रामायण सिर्फ़ एक कहानी नहीं है। प्रभु श्रीराम को भगवान विष्णु का अवतार माना जाता है, जो धरती पर धर्म की स्थापना के लिए आए।"
    caption: "AN *AVATAR* OF VISHNU."
    scene: cosmos
    stage:
      backdrop: cosmos
      fx: [rays, {glow: {actor: vishnu, colour: [255, 220, 150]}}]
      actors:
        vishnu: {puppet: vishnu, x: 540, y: 1450, h: 1100, motion: float, enter: fade}
  - en: "He is called Maryada Purushottam, the ideal man, who kept his word even when it cost him a kingdom."
    hi: "उन्हें मर्यादा पुरुषोत्तम कहा जाता है, यानी आदर्श पुरुष, जिन्होंने राज्य गँवाकर भी अपना वचन निभाया।"
    caption: "MARYADA *PURUSHOTTAM*."
    scene: ayodhya
    stage:
      backdrop: ayodhya
      fx: [rays, {glow: {actor: rama, colour: [180, 220, 255]}}]
      actors:
        rama: {puppet: rama, x: 560, y: 1690, h: 1050, face: right, motion: breathe, enter: fade}
  - en: "And every character shows a way to live: Bharata ruling with Lord Rama's sandals on the throne, Lakshmana's loyalty, Maa Sita's courage, and Hanuman ji's devotion."
    hi: "और हर पात्र जीने का एक रास्ता दिखाता है: प्रभु श्रीराम की खड़ाऊँ गद्दी पर रखकर राज चलाने वाले भरत, लक्ष्मण जी की निष्ठा, माँ सीता का साहस, और हनुमान जी की भक्ति।"
    caption: "A WAY TO *LIVE*."
    scene: ayodhya
    stage:
      backdrop: ayodhya
      fx: [{glow: {actor: throne, colour: [255, 210, 120]}}]
      actors:
        throne: {puppet: throne, x: 540, y: 1560, h: 620, motion: breathe, enter: fade}
  - en: "In the sixteenth century, Goswami Tulsidas retold it in the people's own language as the Ramcharitmanas, and it reached every home. Today it lives on in Ramlila, in Diwali, and in a simple greeting: Ram Ram."
    hi: "सोलहवीं सदी में, गोस्वामी तुलसीदास ने इसे आम लोगों की भाषा में रामचरितमानस के रूप में लिखा, और यह कथा घर-घर पहुँच गई। आज यह रामलीला में, दिवाली में, और एक सीधे-से अभिवादन में ज़िंदा है: राम राम।"
    caption: "IN *EVERY* HOME."
    scene: ramlila
    stage:
      backdrop: ramlila
      fx: [motes]
      actors:
        tulsidas: {puppet: tulsidas, x: 420, y: 1680, h: 820, face: right, motion: breathe, enter: fade}
  - en: "It has travelled far beyond India too, from the Kamba Ramayanam in Tamil to the Ramakien in Thailand. One story, told in hundreds of ways, still teaching what it means to do the right thing."
    hi: "यह कथा भारत से बहुत दूर तक गई है, तमिल के कंब रामायणम से लेकर थाईलैंड के रामकियेन तक। एक कहानी, सैकड़ों रूपों में, जो आज भी सिखाती है कि सही राह पर चलना क्या होता है।"
    caption: "ONE STORY, *MANY* TELLINGS."
    scene: asia
    stage:
      backdrop: asia
      fx: [rays]
      actors: {}
end:
  head: "RAMAYANA"
  sub: "Rama's journey"
