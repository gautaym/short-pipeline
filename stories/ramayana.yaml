    An empty scene painted in flat Indian Kalamkari folk art style, bright colours with dark outlines,
    seen full frame with no border or frame. Uninhabited scenery only: nobody in it, no people, no figures,
    no animals, no text. Vertical composition.
  backdrop_crop: 0.04
  cast:
    rama: >-
      Lord Rama with blue skin, a tall gold crown, a yellow silk dhoti, gold jewellery and a quiver of arrows
      on his back, exactly two arms
    sita: >-
      Sita, a young princess with golden skin and a long dark brown braid, dressed modestly in a full red and
      gold silk saree draped over both shoulders and covering her waist, a full-sleeved red blouse, her head
      uncovered, gold jewellery, exactly two arms with graceful hands, each with five fingers
    lakshmana: >-
      Lakshmana, Rama's younger brother, a young prince with golden skin, a gold crown, an orange silk dhoti,
      gold jewellery and a quiver of arrows on his back, exactly two arms
    ravana: >-
      Ravana, the mighty king of Lanka, with exactly ten crowned heads side by side in one row on a single
      body, each face with a thick dark brown moustache, tall golden crowns, a red and gold royal costume
      with heavy gold jewellery, exactly two arms
    vishnu: >-
      Lord Vishnu with blue skin and exactly four arms, the upper hands holding a white conch shell and a
      golden spinning discus, the lower hands holding a golden mace and a pink lotus, a tall gold crown,
      a yellow silk dhoti and a garland of flowers
    valmiki: >-
      Maharishi Valmiki, a wise sage with warm brown skin, a long white beard, his hair tied in a knot on top
      of his head, a saffron robe and a string of rudraksha beads, exactly two arms
    hanuman: >-
      Lord Hanuman, the mighty monkey god with a reddish-orange face, a golden crown, a red dhoti, gold
      armbands and a long curling tail, exactly two arms and exactly one tail
    tulsidas: >-
      Goswami Tulsidas, a gentle poet-saint with warm brown skin, a short grey beard, a tilak on his
      forehead, a white dhoti and a saffron shawl, exactly two arms
