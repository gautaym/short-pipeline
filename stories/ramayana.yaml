    cranes: "The cut-out is a pair of graceful white cranes with long necks and red-crowned heads, standing side by side, their necks touching, two birds only."
    throne: "The cut-out is a golden royal throne with a red cushion, and on the seat a pair of simple wooden sandals placed side by side."
  backdrops:
