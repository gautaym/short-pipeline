    ayodhya: "The city of Ayodhya at night, rows of palaces and temples with arches and domes under a dark blue sky, no lights yet."
    panchavati: "A forest clearing by a river at dusk, tall trees, flowering bushes and soft orange light."
    sea: "A wide stormy sea under a dramatic sky, a golden island city far away on the horizon."
    cosmos: "A clear night sky full of stars above dark rolling hills, a deep blue and violet sky."
    ramlila: "An open-air village stage at night with a painted curtain, garlands of marigolds and oil lamps along its front edge."
    asia: "Ancient temple towers with tall pointed spires at sunset, palm trees and a golden sky."
