    sita: "The puppet is {sita}, standing gracefully with her hands folded in front of her, side view facing right."
    lakshmana_pray: "The puppet is {lakshmana}, standing with his palms joined in prayer, head bowed, side view facing right."
    ravana: "The puppet is {ravana}, standing proudly with one hand on a sword at his waist and the other hand clenched in anger, front view."
    vishnu: "The puppet is {vishnu}, standing and smiling, front view."
    valmiki: "The puppet is {valmiki}, seated cross-legged and writing on a palm leaf with a stylus, body turned to the right, face turned towards the viewer in three-quarter view."
    hanuman: "The puppet is {hanuman}, leaping forward with one arm stretched out and the other holding a golden mace, body turned to the right, face turned towards the viewer in three-quarter view."
