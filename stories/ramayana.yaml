# What is the Ramayana, and why is it sacred to Hindus?
# Review notes. Valmiki Ramayana: tradition holds that Valmiki, grieving when a hunter shot one of a
# pair of krauncha birds, spoke the first shloka ("ma nishada"), and that this is the adi kavya, the
# first poem in Sanskrit; Brahma then asked him to tell Rama's story. About 24,000 shlokas in seven
# kandas (Bala, Ayodhya, Aranya, Kishkindha, Sundara, Yuddha, Uttara); scholars place its composition
# over several centuries, roughly the 5th century BCE to the early centuries CE, so the script says
# "more than two thousand years ago". "Ramayana" = Rama + ayana, Rama's journey. Rama is revered as
# the seventh avatar of Vishnu and as Maryada Purushottam. Bharata ruled from Nandigram with Rama's
# padukas on the throne. Tulsidas began the Ramcharitmanas in Awadhi in 1574 (16th century).
# Retellings: Kamba Ramayanam (Tamil, 12th c.), Ramakien (Thailand) and many more across Asia.
# Art reused from other stories: Rama and the Ayodhya backdrop (diwali); Sita, Lakshmana, Ravana,
# the manuscript and the Panchavati and Ramlila backdrops (lakshmana_rekha); the night sky and Vishnu
# (dhruva). A Varanasi ghat was tried for Tulsidas but came out as a photograph twice.
# Ravana has seven heads (the model would not draw ten cleanly); the script never counts them.
id: ramayana
topic: mythology
title:
  en: "What is the Ramayana, and why is it so sacred?"
  hi: "रामायण क्या है, और यह इतनी पवित्र क्यों मानी जाती है?"
summary:
  en: "Maharishi Valmiki's Ramayana, the first poem in Sanskrit, tells Lord Rama's journey. Hindus revere it because Lord Rama is an avatar of Lord Vishnu and the ideal of dharma, and because, through Tulsidas, Ramlila and Diwali, it lives in every home."
  hi: "महर्षि वाल्मीकि की रामायण, संस्कृत की पहली कविता, प्रभु श्रीराम की यात्रा की कथा है। हिंदू इसे पवित्र मानते हैं क्योंकि प्रभु श्रीराम भगवान विष्णु के अवतार और धर्म के आदर्श हैं, और तुलसीदास, रामलीला और दिवाली के ज़रिए यह कथा हर घर में बसती है।"
music: chill
