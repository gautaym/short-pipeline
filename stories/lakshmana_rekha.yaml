  - en: "So where did the line come from? Even Tulsidas's Ramcharitmanas doesn't show it at the hut. It is mentioned just once, much later, when Ravana's wife Mandodari mocks him: you could not even cross a small line drawn by Lakshmana."
    hi: "तो फिर यह रेखा आई कहाँ से? तुलसीदास के रामचरितमानस में भी कुटिया वाला यह दृश्य नहीं है। इसका ज़िक्र बस एक बार आता है, बहुत बाद में, जब मंदोदरी रावण को ताना मारती है कि तुम तो लक्ष्मण की खींची एक छोटी-सी रेखा भी पार नहीं कर पाए।"
