# The Lakshmana Rekha: the line that is not in the oldest Ramayana.
# Review notes. Valmiki Ramayana, Aranya Kanda 3.43-46: Maricha, as a golden deer, lures Rama away and
# cries out in Rama's voice; Sita, frightened, speaks harshly to Lakshmana and questions his motives;
# he answers, asks the deities of the forest to protect her (3.45.33) and leaves; Ravana comes as a
# wandering ascetic, Sita receives him as a guest, and he abducts her. No line is drawn.
# Tulsidas's Ramcharitmanas has no line at the hut either (Aranya Kand); the only mention is in Lanka
# Kand (6.35.1), where Mandodari mocks Ravana that he could not cross even the small line drawn by
# Rama's younger brother. The full scene (the line drawn, Sita stepping over it to give alms) comes
# from later retellings such as the Radheshyam Ramayana and the Ramlila stage. Sources:
# en.wikipedia.org/wiki/Lakshmana_rekha; vedapath.app/en/ramayana/aranya-kanda/45. The user's brief said
# Tulsidas popularised the scene; the script says, more precisely, that he mentions it once.
# Script choices: "the oldest telling" for Valmiki; "later retellings and Ramlila stages" rather than
# naming a single source for the full scene.
id: lakshmana_rekha
topic: mythology
title:
  en: "Did Lakshmana really draw a line around Sita?"
  hi: "क्या लक्ष्मण ने सच में सीता के लिए रेखा खींची थी?"
summary:
  en: "The Lakshman Rekha is one of the most famous scenes of the Ramayana, but it is not in Valmiki's telling. Tulsidas mentions it only once, through Mandodari; later retellings and the Ramlila stage made it the scene everyone knows."
  hi: "लक्ष्मण रेखा रामायण के सबसे मशहूर दृश्यों में से है, पर वाल्मीकि की रामायण में यह है ही नहीं। तुलसीदास इसका ज़िक्र सिर्फ़ एक बार, मंदोदरी के मुँह से करते हैं; बाद की कथाओं और रामलीला ने इसे वह दृश्य बना दिया जिसे सब जानते हैं।"
