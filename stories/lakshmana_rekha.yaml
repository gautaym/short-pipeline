    hi: "आज 'लक्ष्मण रेखा' का मतलब है ऐसी सीमा, जिसे कभी पार नहीं करना चाहिए। एक रेखा जो इतनी मशहूर है, और फिर भी सबसे पुरानी कहानी में कभी खींची ही नहीं गई।"
