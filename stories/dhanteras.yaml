# POV-style Festival Stories: Dhanteras, the night a wife kept Yamraj at the door. From the user's idea (2026-11-04).
# Review notes. A folk tale told for Dhanteras (Dhanatrayodashi): King Hima's sixteen-year-old son was fated to
# die of a snakebite on the fourth day of his marriage. His young wife heaped gold and silver ornaments at the
# chamber door, lit lamps everywhere, and kept him awake all night with stories and songs. Yama came as a
# serpent, was dazzled by the light, climbed onto the heap and sat listening until dawn, then left quietly.
# This is linked to Yamadeepdaan, the lamp lit for Yama on Dhanteras evening. Dhanteras is also Dhanvantari
# Jayanti: Bhagwan Dhanvantari, the god of Ayurveda, rose from the churning of the ocean with the pot of amrit.
# Folk tale, so "lok-katha hai"; jokes are on the situation, never on Yamraj (Dharmaraj).
# Sources: timesofindia.com and drikpanchang.com (Dhanteras story, Yamadeepdaan), wikipedia.org (Dhanteras,
# Dhanvantari). Hinglish, Shaunak's voice, candlelit anime look, full kinetic captions: --captions all.
