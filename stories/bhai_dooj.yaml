title:
  en: "Why do we celebrate Bhai Dooj?"
  hi: "हम भाई दूज क्यों मनाते हैं?"
series:
  en: "Festival Stories"
  hi: "त्योहारों की कहानियाँ"
summary:
  en: "Yamuna waited years for her brother Yama, the god of death, to visit. When he finally came on the second day after Diwali, she welcomed him with aarti, a tilak and a feast, and he blessed every brother who receives a tilak from his sister on this day."
  hi: "यमुना ने अपने भाई, मृत्यु के देवता यमराज का बरसों इंतज़ार किया। दिवाली के दो दिन बाद जब वे आए, तो यमुना ने आरती, तिलक और भोजन से उनका स्वागत किया, और यमराज ने हर उस भाई को आशीर्वाद दिया जो इस दिन बहन से तिलक लगवाए।"
