  - en: "Yamuna was overjoyed. She did his aarti, put a tilak on his forehead, and cooked him a feast with her own hands."
    hi: "यमुना ख़ुशी से झूम उठी। उसने भाई की आरती उतारी, माथे पर तिलक लगाया, और अपने हाथों से उन्हें खाना खिलाया।"
