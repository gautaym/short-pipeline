# Festival Stories, part 2: why we celebrate Bhai Dooj.
# Review notes. Bhai Dooj falls on Kartik Shukla Dwitiya, the second day after Diwali's new moon,
# and is also called Yama Dwitiya. Legend 1: Yamuna (Yami), twin sister of Yama and child of the Sun
# god Surya, kept inviting her brother; he finally came on this day; she did his aarti, put a tilak
# on his forehead and fed him; he granted a boon to brothers who receive a tilak from their sisters
# on this day (wordings vary; the script says "protected from untimely death", the common one).
# Legend 2: after defeating Narakasura, Krishna visited his sister Subhadra, who welcomed him with
# lamps, sweets and a tilak. Regional names: Bhau Beej (Maharashtra), Bhai Phonta (Bengal),
# Bhai Tika (Nepal). Sources: hindupedia.com/en/Bhaiya-Duj, festivalsofindia.in/bhai-dooj/legends.
