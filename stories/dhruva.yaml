      fx: [lightning]
      actors:
        dhruva: {puppet: dhruva_pray, x: 540, y: 1600, h: 900, face: right, motion: breathe}
  - en: "Moved by his devotion, Vishnu appeared, and blessed him with a place no one could ever take."
    hi: "उनकी भक्ति से प्रसन्न होकर, विष्णु प्रकट हुए, और उन्हें ऐसा स्थान दिया, जिसे कोई कभी छीन नहीं सकता।"
    caption: "*VISHNU* APPEARED."
