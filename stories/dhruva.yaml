# Sky Stories, part 1: Dhruva and the Pole Star.
# Review notes. Myth (Bhagavata Purana, Vishnu Purana): Dhruva, five-year-old son of King Uttanapada
# and Queen Suniti, is denied his father's lap and sent away by his stepmother Queen Suruchi; on
# Narada's advice he does penance to Vishnu in the forest (Madhuvana), standing motionless; Vishnu
# appears and grants him an eternal, unmoving place: Dhruvaloka, the Pole Star (Dhruva Tara).
# Science: Polaris lies within about a degree of the north celestial pole, so it barely moves while
# the other stars circle it as Earth turns. The script says "almost" because Polaris does trace a
# tiny circle; it skips precession (Vega in ~12,000 years) to stay under 45 seconds.
id: dhruva
topic: mythology
series_part: 1
title:
  en: "Why does one star never move?"
  hi: "एक तारा कभी क्यों नहीं हिलता?"
series:
  en: "Sky Stories"
  hi: "आकाश की कहानियाँ"
summary:
  en: "Little Dhruva's devotion won him a place no one could take: the Pole Star. And science agrees, almost: it sits nearly above Earth's North Pole, so every other star circles it."
  hi: "नन्हे ध्रुव की भक्ति ने उन्हें ऐसा स्थान दिलाया जिसे कोई छीन नहीं सकता: ध्रुव तारा। और विज्ञान भी, लगभग, यही कहता है: यह धरती के उत्तरी ध्रुव के लगभग ठीक ऊपर है, इसलिए बाकी सारे तारे इसके चारों ओर घूमते हैं।"
music: chill
cast: {}
# Opens on beat 5's frame (the star trails) with the question and the Sutradhar, then tells the story.
segment: indian_myth
opening:
  beat: 5
art:
  puppet_style: >-
    A single flat painted leather shadow puppet, traditional Andhra Tholu Bommalata style, mounted on a
    thin bamboo stick, bright flat colours with dark outlines, a pale cut edge and visible rivet joints,
    full body from head to feet, studio photo against a plain pure black backdrop, nothing else in the frame.
  prop_style: >-
    A single flat painted leather shadow puppet scenery piece, a cut-out prop rather than a character,
    traditional Andhra Tholu Bommalata style, bright flat colours with dark outlines and a pale cut edge,
    studio photo against a plain pure black backdrop, nothing else in the frame.
  backdrop_style: >-
    An empty landscape painted in flat Indian Kalamkari folk art style, bright colours with dark outlines,
    seen full frame with no border or frame. Uninhabited scenery only: nobody in it, no people, no figures,
    no animals, no text. Vertical composition.
  cast:
    dhruva: >-
      the young prince Dhruva, a small five-year-old boy with warm brown skin, a small gold crown, a yellow
      dhoti and gold jewellery, exactly two arms
    suruchi: >-
      Queen Suruchi, a proud queen with warm golden skin, a green silk saree with a gold border, a tall gold
      crown and heavy gold jewellery, exactly two arms
    vishnu: >-
      Lord Vishnu with blue skin and exactly four arms, the upper hands holding a white conch shell and a
      golden spinning discus, the lower hands holding a golden mace and a pink lotus, a tall gold crown,
      a yellow silk dhoti and a garland of flowers
  puppets:
    dhruva_sad: "The puppet is {dhruva}, standing with his head bowed, one hand wiping his eyes, crying, side view facing right."
    dhruva_pray: "The puppet is {dhruva}, standing perfectly still on one leg in deep meditation, palms joined in prayer above his head, eyes closed, side view facing right."
    queen: "The puppet is {suruchi}, standing tall and pointing away angrily with one arm stretched out, side view facing right."
    vishnu: "The puppet is {vishnu}, standing and smiling, front view."
  props:
    pole_star: "The prop is a single large golden eight-pointed star with long glowing rays and a bright white centre."
  backdrops:
    palace: "A royal palace hall with carved pillars, red and gold curtains and a golden throne in the distance."
    forest: "A dense forest at dusk with tall trees, hanging vines and a stormy sky with rain clouds."
    night_sky: "A clear night sky full of stars above dark rolling hills, a deep blue and violet sky."
  anchors: {}
beats:
  - en: "Little prince Dhruva wanted to sit on his father's lap. But his stepmother, Queen Suruchi, sent him away."
    hi: "नन्हे राजकुमार ध्रुव अपने पिता की गोद में बैठना चाहते थे। लेकिन उनकी सौतेली माँ, रानी सुरुचि ने उन्हें दूर भेज दिया।"
    caption: "DHRUVA WAS *SENT AWAY*."
    scene: palace
    stage:
      backdrop: palace
      actors:
        queen: {puppet: queen, x: 770, y: 1600, h: 1100, face: left, motion: sway, enter: right}
