  - en: "Only five years old, he went into the forest and prayed to Lord Vishnu, without moving, through sun, rain and storm."
    hi: "सिर्फ़ पाँच साल की उम्र में, वह वन में गए और भगवान विष्णु की तपस्या की, बिना हिले, धूप, बारिश और तूफ़ान में।"
    caption: "HE PRAYED, *UNMOVING*."
    scene: forest
    stage:
