      fx: [rays, {glow: {actor: vishnu, colour: [255, 220, 150]}}]
      actors:
        dhruva: {puppet: dhruva_pray, x: 280, y: 1600, h: 760, face: right, motion: breathe}
        vishnu: {puppet: vishnu, x: 720, y: 1620, h: 1250, motion: breathe, enter: fade}
  - en: "Dhruva became the unmoving star of the north. Dhruva Tara, the Pole Star."
    hi: "ध्रुव बन गए उत्तर दिशा का अटल तारा। ध्रुव तारा।"
    caption: "THE *POLE STAR*."
    scene: cosmos
    stage:
      backdrop: night_sky
      fx: [{glow: {actor: dhruva, colour: [255, 230, 160]}}]
      actors:
        dhruva: {puppet: pole_star, x: 540, y: 820, h: 380, motion: breathe}
  - en: "And science agrees, almost. The Pole Star sits nearly above Earth's North Pole, so as Earth spins, every other star circles around it."
    hi: "और विज्ञान भी, लगभग, यही कहता है। ध्रुव तारा धरती के उत्तरी ध्रुव के लगभग ठीक ऊपर है, इसलिए धरती के घूमने पर बाकी सारे तारे उसके चारों ओर घूमते हैं।"
    caption: "*EVERY* STAR CIRCLES IT."
    scene: cosmos
    stage:
      backdrop: night_sky
      fx: [{star_trails: {x: 540, y: 900}}, {glow: {actor: dhruva, colour: [255, 230, 160]}}]
      actors:
        dhruva: {puppet: pole_star, x: 540, y: 1020, h: 240, motion: breathe}
  - en: "So look north tonight, and find the one star that stays. Now you know why it never moves."
    hi: "तो आज रात उत्तर की ओर देखिए, और वह एक तारा ढूँढिए जो नहीं हिलता। अब आप जानते हैं, क्यों।"
    caption: "LOOK *NORTH* TONIGHT."
    scene: cosmos
    stage:
      backdrop: night_sky
      fx: [{star_trails: {x: 540, y: 900}}, {glow: {actor: dhruva, colour: [255, 230, 160]}}]
      actors:
        dhruva: {puppet: pole_star, x: 540, y: 1020, h: 240, motion: breathe}
