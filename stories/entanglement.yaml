# Quantum entanglement, explained without the usual myths.
# Review notes, physics: entangled particles share one quantum state; measured along the same axis
# (e.g. a spin singlet) their results always come out opposite, each result on its own is random.
# Bell (1964) showed "decided in advance" (local hidden variables) makes testably different
# predictions; experiments (Clauser, Aspect, Zeilinger: 2022 Nobel Prize in Physics, "for
# experiments with entangled photons, establishing the violation of Bell inequalities") showed the
# results are not decided in advance. Because each result is random, entanglement cannot send a
# message faster than light (no-signalling). Einstein's "spooky action at a distance" is from his
# 1947 letter to Max Born. The coins are an analogy and the script says so.
id: entanglement
topic: science
title:
  en: "What is quantum entanglement?"
  hi: "क्वांटम एंटैंगलमेंट क्या है?"
series:
  en: "Science Stories"
  hi: "विज्ञान की कहानियाँ"
summary:
  en: "Two entangled particles share one quantum state: measure one, and you instantly know the other, however far apart they are. Einstein called it spooky, experiments proved it real, and it still cannot send messages faster than light."
  hi: "दो एंटैंगल्ड कण एक ही क्वांटम अवस्था साझा करते हैं: एक को मापिए, और दूसरे का नतीजा तुरंत पता चल जाता है, चाहे वे कितनी भी दूर हों। आइंस्टीन ने इसे भुतहा कहा, प्रयोगों ने इसे सच साबित किया, और फिर भी इससे प्रकाश से तेज़ संदेश नहीं भेजा जा सकता।"
music: chill
segment: science
opening:
  beat: 4
cast: {}
