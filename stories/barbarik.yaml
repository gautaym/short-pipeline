# Mahabharata Secrets, part 1: Barbarik, the warrior who could end the war in one minute.
# Review notes. Barbarik (Barbarika) is not in Vyasa's critical Mahabharata; his story comes from the
# Skanda Purana (Kaumarika Khanda) and from folk tradition in Rajasthan, where he is worshipped as Khatu
# Shyam Ji, "haare ka sahara" (the support of those who are losing). Hence "the folk tale says" in beat 1.
# He is the son of Ghatotkacha, so Bhima's grandson. His three infallible arrows were a divine boon (the
# Purana credits the goddesses; popular tellings say Lord Shiva), so the script just says a boon. In the
# folk telling Krishna asks the warriors how many days they need: Bhishma 20, Drona 25, Karna 24,
# Arjuna 28, Barbarik one minute (Vyasa's Udyoga Parva has a different exchange, with Duryodhana
# asking). Krishna, disguised as a Brahmin, tests him on a peepal tree with one leaf hidden under his
# foot; Barbarik's vow to his mother to fight for the losing side means he would keep switching sides
# until only he was left; Krishna asks for his head as a gift, Barbarik gives it and watches the whole
# war from a hilltop. The head is never shown: he watches as a glowing figure on the hill.
# Sources: Skanda Purana summaries on wikipedia.org (Barbarika), khatushyam temple trust pages,
# timesofindia.com (Khatu Shyam story).
# Made for a fast feed: pace fast, narrator only, few captions. Render with --captions few.
