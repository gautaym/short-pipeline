  - en: "So tell me. If Barbarik had fought, would there have been a Mahabharata at all?"
    hi: "अब आप बताइए। अगर बर्बरीक लड़ते, तो क्या महाभारत होता भी?"
    stage:
      backdrop: battlefield
      fx: [smoke_far]
      actors:
