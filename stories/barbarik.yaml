  - en: "Today he is worshipped as Khatu Shyam Ji. Haare ka sahara, the friend of everyone who is losing."
    hi: "आज वही बर्बरीक, खाटू श्याम जी के नाम से पूजे जाते हैं। हारे का सहारा।"
