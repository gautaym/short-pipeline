# POV, part 1: You are Karna. A Gen-Z, Hinglish retelling from the user's own idea (2026-11-04).
# Review notes. Karna was born to Kunti before her marriage, with divine armour and earrings (kavach and
# kundal) from Surya; the unmarried young Kunti set him afloat in a basket on the river, and the
# charioteer Adhiratha and Radha raised him, hence "suta-putra". At the tournament in Hastinapur he matched
# Arjuna, Kripa demanded his lineage, and Duryodhana made him king of Anga on the spot (Adi Parva).
# Before the war Shri Krishna told him he was Kunti's eldest son and offered him the throne if he joined
# the Pandavas; separately Kunti came to him at the river where he worshipped the sun and asked him to
# join his brothers. He refused both, out of loyalty to Duryodhana, but promised Kunti he would not kill
# any of her sons except Arjuna, so she would always have five sons (Udyoga Parva). The Gen-Z jokes are
# aimed at the system, never at the people: Kunti is "a frightened young mother", Shri Krishna keeps his
# honorific. Sources: Adi Parva and Udyoga Parva summaries (wikipedia.org: Karna; Kunti).
# Hinglish narration in a young, casual voice (not our storytelling narrators); full meme captions:
# render with --captions all.
