    sky: "A wide sky above the clouds at golden sunrise, soft pink and gold clouds below."
    freedom: "Wide open fortress gates at dawn, broken chains on the stone floor, golden light pouring in."
    dwarka: "A white and gold palace beside the sea at sunset, domes and arches, small lamps on the steps."
    courtyard: "A palace courtyard in the evening with a colourful rangoli on the floor, marigold garlands and small oil lamps along the walls."
    puri: "The inside of a grand old Indian temple hall, carved stone pillars, warm lamp light, marigold garlands, an empty stone platform at the back."
    rath: "A wide festival street in an Indian temple town, three tall empty wooden temple chariots with big wheels and colourful red, yellow and green cloth canopies in a row, flags and flowers."
