summary:
  en: "After defeating Narakasura, Lord Krishna went home to his sister Subhadra, who welcomed him with aarti, a tilak and sweets. It is believed that this is how Bhai Dooj began, and in Puri the sister still stands between her two brothers."
  hi: "नरकासुर को हराकर श्रीकृष्ण अपनी बहन सुभद्रा के पास पहुँचे, और सुभद्रा ने आरती, तिलक और मिठाई से उनका स्वागत किया। मान्यता है कि भाई दूज यहीं से शुरू हुई, और पुरी में आज भी बहन अपने दोनों भाइयों के बीच विराजती हैं।"
music: festive
