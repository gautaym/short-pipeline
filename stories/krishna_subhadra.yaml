beats:
  - en: "In the city of Pragjyotisha ruled a demon king named Narakasura. He held sixteen thousand princesses captive, and even the gods feared him."
    hi: "प्राग्ज्योतिषपुर में नरकासुर नाम का एक असुर राजा राज करता था। उसने सोलह हज़ार राजकुमारियों को क़ैद कर रखा था, और देवता तक उससे डरते थे।"
    caption: "A DEMON KING'S *PRISON*."
    name: {head: "NARAKASURA", sub: "Demon king of Pragjyotisha"}
    stage:
      backdrop: fortress
      fx: [smoke_far, lightning]
      actors:
        narakasura: {puppet: narakasura, x: 560, y: 1720, h: 1120, face: left, motion: breathe, enter: fade}
  - en: "So Lord Krishna, with Satyabhama by his side, flew on Garuda to his fortress."
    hi: "तब श्रीकृष्ण, देवी सत्यभामा को साथ लेकर, गरुड़ पर सवार होकर उसके क़िले की ओर चल पड़े।"
    caption: "SHRI KRISHNA *RIDES OUT*."
    name: {head: "SHRI KRISHNA", sub: "Lord of Dwarka"}
    stage:
      backdrop: sky
      fx: [rays]
      actors:
        krishna: {puppet: krishna, x: 560, y: 1700, h: 1060, face: right, motion: sway, enter: right}
  - en: "A fierce battle broke out. Narakasura charged with his club, and Satyabhama drew her bow."
    hi: "घमासान युद्ध छिड़ गया। नरकासुर गदा लेकर टूट पड़ा, और देवी सत्यभामा ने धनुष तान लिया।"
    caption: "SATYABHAMA *DRAWS HER BOW*."
    name: {head: "SATYABHAMA", sub: "Queen of Shri Krishna", y: 600}
    stage:
      backdrop: fortress
      fx: [lightning, motes]
      actors:
        krishna: {puppet: krishna_throw, x: 250, y: 1700, h: 900, z: -1, face: right, motion: breathe, enter: left}
        satyabhama: {puppet: satyabhama, x: 480, y: 1720, h: 860, face: right, motion: sway, enter: left}
        narakasura: {puppet: narakasura_angry, x: 900, y: 1730, h: 940, face: left, motion: tremble, enter: right}
  - en: "[excited] Then Krishna let fly his Sudarshana Chakra, and Narakasura fell."
    hi: "[excited] तभी श्रीकृष्ण ने सुदर्शन चक्र चलाया, और नरकासुर वहीं ढेर हो गया।"
    caption: "THE *SUDARSHANA CHAKRA*."
    key: true
    stage:
      backdrop: fortress
      fx: [lightning, {strike: {from: [490, 1090], to: [880, 1150]}}]
      actors:
        satyabhama: {puppet: satyabhama, x: 120, y: 1700, h: 780, z: -1, face: right, motion: breathe}
        krishna: {puppet: krishna_hurl, x: 270, y: 1710, h: 920, face: right, motion: breathe}
        narakasura: {puppet: narakasura_fall, x: 900, y: 1730, h: 900, face: left, motion: fall}
  - en: "[excited] Sixteen thousand princesses were free. It was the fourteenth day of the dark half of Kartik, the day we now call Naraka Chaturdashi, or Choti Diwali."
    hi: "[excited] सोलह हज़ार राजकुमारियाँ आज़ाद हो गईं। वो कार्तिक की चतुर्दशी थी, जिसे आज हम नरक चतुर्दशी, यानी छोटी दिवाली कहते हैं।"
    caption: "SIXTEEN THOUSAND, *FREE*."
    title_card: "NARAKA CHATURDASHI"
    stage:
      backdrop: freedom
      fx: [rays, {diyas: {y: 1760, rows: 1, n: 9, grow: 3.0}}]
      actors:
        krishna: {puppet: krishna_home, x: 560, y: 1720, h: 1040, face: right, motion: sway, enter: fade}
  - en: "Back in Dwarka, his little sister Subhadra was counting the days. Her aarti plate was ready. She was only waiting for her brother to come home."
    hi: "उधर द्वारका में, उनकी छोटी बहन सुभद्रा दिन गिन रही थी। आरती की थाली सजी थी, बस भाई के लौटने का इंतज़ार था।"
    caption: "A SISTER *WAITS*."
    name: {head: "SUBHADRA", sub: "Sister of Shri Krishna"}
    stage:
      backdrop: dwarka
      fx: [{glow: {actor: subhadra, colour: [255, 200, 120]}}]
      actors:
        subhadra: {puppet: subhadra_wait, x: 540, y: 1700, h: 980, face: right, motion: sway, enter: fade}
  - en: "Two days after Diwali, on the second day of the bright half of Kartik, Krishna finally reached her door."
    hi: "दिवाली के दो दिन बाद, कार्तिक शुक्ल द्वितीया को, श्रीकृष्ण आख़िरकार उसके द्वार पर पहुँचे।"
    caption: "HE *CAME HOME*."
    title_card: "KARTIK SHUKLA DWITIYA"
    stage:
      backdrop: dwarka
      actors:
        subhadra: {puppet: subhadra_wait, x: 320, y: 1700, h: 960, face: right, motion: sway}
        krishna: {puppet: krishna_home, x: 770, y: 1720, h: 1040, face: left, motion: walk_in, enter: right}
  - en: "Subhadra welcomed him with flowers, did his aarti, put a tilak on his forehead, and fed him sweets with her own hands."
    hi: "सुभद्रा ने फूलों से उनका स्वागत किया, आरती उतारी, माथे पर तिलक लगाया, और अपने हाथों से मिठाई खिलाई।"
    caption: "AARTI AND *TILAK*."
    key: true
    stage:
      backdrop: courtyard
      fx: [{glow: {actor: subhadra, colour: [255, 200, 110]}}, {diyas: {y: 1770, rows: 1, n: 9, grow: 3.0}}]
      actors:
        subhadra: {puppet: subhadra_tilak, x: 330, y: 1700, h: 960, face: right, motion: sway, enter: fade}
        krishna: {puppet: krishna_home, x: 760, y: 1720, h: 1040, face: left, motion: breathe, enter: fade}
  - en: "[excited] Krishna was deeply moved, and he blessed her. Any brother who receives a tilak from his sister on this day will live a long and happy life. It is believed that this is how Bhai Dooj began."
    hi: "[excited] श्रीकृष्ण का मन भर आया, और उन्होंने आशीर्वाद दिया। इस दिन जो भाई अपनी बहन से तिलक लगवाएगा, उसकी उम्र लंबी होगी। मान्यता है कि भाई दूज यहीं से शुरू हुई।"
    caption: "A *BLESSING* FOR EVERY BROTHER."
    title_card: "BHAI DOOJ"
    stage:
      backdrop: courtyard
      fx: [rays, {glow: {actor: krishna, colour: [255, 230, 150]}}, {diyas: {y: 1770, rows: 1, n: 9, grow: 0.01}}]
      actors:
        subhadra: {puppet: subhadra_tilak, x: 330, y: 1700, h: 960, face: right, motion: breathe}
        krishna: {puppet: krishna_bless, x: 760, y: 1720, h: 1040, face: left, motion: sway}
  - en: "And you can still see this bond today. In the Jagannath temple at Puri, Subhadra stands between her two brothers, Jagannath and Balabhadra."
    hi: "और ये रिश्ता आज भी दिखता है। पुरी के जगन्नाथ मंदिर में देवी सुभद्रा अपने दोनों भाइयों, जगन्नाथ और बलभद्र के बीच विराजती हैं।"
    caption: "THE SISTER IN THE *MIDDLE*."
    key: true
    title_card: "JAGANNATH PURI"
    stage:
      backdrop: puri
      fx: [rays]
      actors:
        balarama: {puppet: balarama, x: 210, y: 1720, h: 1000, face: right, motion: breathe, enter: left}
        subhadra: {puppet: subhadra, x: 540, y: 1690, h: 900, face: right, motion: sway, enter: fade}
        krishna: {puppet: krishna_home, x: 870, y: 1720, h: 1000, face: left, motion: breathe, enter: right}
  - en: "Even in the Rath Yatra, her chariot rolls in the middle. Her elder brother Balabhadra leads, Jagannath follows, and their sister rides safely between them."
    hi: "रथ यात्रा में भी उनका रथ बीच में चलता है। आगे बड़े भाई बलभद्र, पीछे जगन्नाथ, और बीच में बहन, दोनों भाइयों की हिफ़ाज़त में।"
    caption: "SAFE *BETWEEN* HER BROTHERS."
    title_card: "RATH YATRA"
    name: {head: "BALABHADRA", sub: "Elder brother, also called Balarama"}
    stage:
      backdrop: rath
      fx: [{diyas: {y: 1780, rows: 1, n: 9, grow: 4.0}}]
      actors: {}
  - en: "So this Bhai Dooj, when a sister puts a tilak on her brother, remember that it is a bond the Lord himself honoured."
    hi: "तो इस भाई दूज, जब बहन भाई को तिलक लगाए, तो याद रखिए, ये वही रिश्ता है जिसे स्वयं भगवान ने निभाया।"
    caption: "A BOND THE LORD *HONOURED*."
    stage:
      backdrop: courtyard
      fx: [rays, {diyas: {y: 1740, rows: 2, n: 9, grow: 0.01}}, {fireworks: {n: 3}}]
      actors: {}
