art:
  puppet_style: >-
    A single full-body cartoon character in flat 2D vector illustration style, like a modern Indian
    mythology explainer animation: simple clean shapes, smooth dark outlines, flat bright colours with
    soft simple shading, a friendly expressive face with clear eyes, full body from head to feet, three
    quarter view turned to the right, against a plain pure black background, nothing else in the frame,
    no text.
  prop_style: >-
    A single object in flat 2D vector illustration style, not a person: simple clean shapes, smooth dark
    outlines, flat bright colours, against a plain pure black background, nothing else in the frame, no text.
  backdrop_style: >-
    A background scene in flat 2D vector cartoon illustration style, like a modern Indian mythology
    explainer animation: simple clean shapes, smooth colour gradients, warm soft light, an open floor
    across the lower third, seen full frame with no border or frame. Empty scenery only: nobody in it, no
    people, no figures, no animals, no text. Vertical composition.
  cast:
    krishna: >-
      Lord Krishna, a handsome young man with blue skin and dark curly hair, a gold crown with a peacock
      feather, a yellow silk dhoti, a flower garland and gold jewellery, exactly two arms
    subhadra: >-
      Subhadra, Krishna's younger sister, a young princess with golden-brown skin and a long dark braid,
      dressed modestly in a full pink and gold saree over both shoulders with a full-sleeved blouse, a small
      gold crown and gold jewellery, exactly two arms with graceful hands
    satyabhama: >-
      Satyabhama, a brave young queen with golden-brown skin and dark hair in a bun, dressed modestly in
      a full red and gold saree with a full-sleeved blouse, a gold crown, exactly two arms
    narakasura: >-
      Narakasura, a huge demon king with dark green skin, two small horns, fierce eyes, a black moustache,
      a spiked gold crown, black and red armour, exactly two arms
    balarama: >-
      Balarama, Krishna's elder brother, a strong man with fair skin and dark hair, a gold crown, a blue
      silk dhoti, a flower garland, exactly two arms
    sutradhar: >-
      the sutradhar, a cheerful middle-aged storyteller of about forty five with warm brown skin, a thick
      dark brown moustache and no beard, a big red and yellow turban, a white kurta with a red and gold
      sash and a white dhoti, exactly two arms
    meera: >-
      Meera, a young Indian woman of about twenty with warm brown skin, a long dark brown braid, a bright
      yellow and pink kurta with a pink dupatta, curious eyes, exactly two arms
  puppets:
    narakasura: "The character is {narakasura}, standing tall and laughing cruelly, holding a big spiked club."
    narakasura_angry: "The character is {narakasura}, snarling angrily with bared teeth, raising a big spiked club high to attack, side view facing right."
    narakasura_fall: "The character is {narakasura}, defeated, staggering backwards with his arms thrown out, eyes shut in pain, his crown slipping off, side view facing right."
    krishna: "The character is {krishna}, standing bravely, one hand raised with a glowing golden spinning discus above his finger."
    krishna_throw: "The character is {krishna}, seen from the side in profile facing right, determined, one arm stretched forward pointing straight ahead, a glowing golden spinning discus on his raised finger."
    krishna_hurl: "The character is {krishna}, seen from the side in profile facing right, determined, one arm stretched straight forward with the index finger pointing ahead, the other arm back, nothing in his hands."
    satyabhama: "The character is {satyabhama}, drawing a golden bow with an arrow, aiming bravely."
    subhadra_wait: "The character is {subhadra}, holding a round brass aarti plate with a small lit lamp, looking hopefully into the distance."
    krishna_home: "The character is {krishna}, smiling warmly, one hand raised in greeting."
    subhadra_tilak: "The character is {subhadra}, smiling, holding a small brass plate in one hand and reaching forward with the other hand to put a red tilak."
    krishna_bless: "The character is {krishna}, smiling, raising one hand in blessing with the palm open."
    balarama: "The character is {balarama}, standing proudly, a wooden plough resting on his shoulder."
    subhadra: "The character is {subhadra}, standing gracefully with her hands folded in greeting."
    sutradhar: "The character is {sutradhar}, one hand raised with the index finger up as if telling a story, the other hand on his hip."
    meera: "The character is {meera}, one hand raised as if asking a question."
