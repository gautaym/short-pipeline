# Festival Stories, part 3: Shri Krishna and Subhadra, the other Bhai Dooj story.
# Review notes. Narakasura of Pragjyotisha held 16,000 (16,100 in the Bhagavata) princesses captive;
# Krishna flew there on Garuda with Satyabhama, who fought beside him, and his Sudarshana Chakra killed
# Narakasura (Bhagavata Purana 10.59). The day is kept as Naraka Chaturdashi (Choti Diwali). That
# Krishna then visited his sister Subhadra, who welcomed him with flowers, aarti, a tilak and sweets,
# and that this began Bhai Dooj (Kartik Shukla Dwitiya), is folk tradition, told beside the Yama and
# Yamuna legend; the script says "it is believed". Puri: Subhadra stands between Jagannath and
# Balabhadra in the sanctum, and in the Rath Yatra her chariot (Darpadalana) rolls between
# Balabhadra's (Taladhwaja, first) and Jagannath's (Nandighosha, last).
# Sources: festivalsofindia.in/bhai-dooj/legends, incredibleindia.gov.in (Bhai Dooj), vedadhara.com.
# Drawn in a flat cartoon style, not leather puppets; the hosts are drawn in the same style here.
