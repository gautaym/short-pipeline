# Default settings for reel_engine. Copy this file and pass it with --config to override.
# Canvas size (1080x1920) and frame rate (30 fps) are fixed by the formats' layouts for now.

render:
  output_dir: out        # where reel_<format>_<seed>.mp4 files go (unless --out is given)
  workers: 1             # reels rendered in parallel; --workers overrides
  scout: 8               # seeds simulated per reel, keeping the most dramatic; 1 = use the seed as given
  min_length: 20         # seconds; scouting avoids shorter runs, and any that remain hold their end card
  music: true            # generated background music under the sound effects
  music_level: 0.55      # music loudness as a share of the effects' loudness
  voice: true            # speak the hook and the result (needs the Kokoro files in models/)
  voice_name: am_michael # US: am_michael, am_adam, af_heart, af_bella...; UK: bm_george, bf_emma...
  voice_speed: 1.05
  voice_level: 1.8       # how loud the voice is compared with music and effects (raise for louder speech)
  voice_name_hi: "chatterbox:hi:aman" # Hindi narrator: chatterbox:hi[:<clip in models/voice_refs>] (needs cbenv), indic:<Speaker>[:warm|deep] (needs ttsenv), or a Kokoro voice such as hm_omega
  crf: 20                # x264 quality: lower is better and bigger
  preset: veryfast       # x264 speed/size trade-off
  audio_bitrate: 160k
  # ledger: out/ledger.sqlite   # record of every reel; defaults to <output_dir>/ledger.sqlite

channel:
  name: ""
  # Must be set to true or false before anything is uploaded. There is deliberately no default:
  # it is a legal declaration (YouTube's COPPA setting) that only you can make.
  made_for_kids:
  tags: [simulation, satisfying]
  hashtags: []
